[functions.fb-oauth-start]
verify_jwt = true

[functions.fb-oauth-callback]
# Appelée directement par la redirection Facebook (pas de JWT Supabase).
# La sécurité repose sur la signature du paramètre `state`.
verify_jwt = false

[functions.fb-publish-post]
verify_jwt = true

[functions.tiktok-oauth-start]
verify_jwt = true

[functions.tiktok-oauth-callback]
# Appelée directement par la redirection TikTok (pas de JWT Supabase).
verify_jwt = false

[functions.tiktok-publish-post]
verify_jwt = true

[functions.cross-post-dispatch]
# Appelée par pg_cron via net.http_post (pas de JWT Supabase).
# La sécurité repose sur le header x-cron-secret (CRON_DISPATCH_SECRET).
verify_jwt = false
